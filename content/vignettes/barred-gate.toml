id = "barred-gate"
name = "The barred gate"
stat = "Craft"
difficulty = 11
weight = 3
tags = ["delve", "town"]

[conditions]
tags = ["town", "guard", "delve", "dark", "recover", "escort"]

[slots]
hero = "highest:Craft"

[outcomes.failure]
narrative = "The gate is barred from the far side and the hinges are set in stone, not timber. {hero} works at it with wire and patience until the wire snaps off in the ward and makes the whole thing worse. They go by the ditch in the end, which costs them half a day and one of the lanterns, and the bar is still on when they come past it again."
consequences = [
  { kind = "score", delta = -1 },
  { kind = "heroRegardForGuildmaster", delta = -1, reason = "the gate cost half a day and nobody had thought to send the right wire" },
]

[outcomes.success]
narrative = "{hero} spends a long while on the hinges rather than the lock, which is where the timber has gone soft. It comes off the lower pin with the flat of a knife and the weight of one shoulder. Nothing is broken that cannot be put back, and when they are through {hero.they} {hero.moves} the pin into place again, so that anyone following finds the gate as it was."
consequences = [
  { kind = "score", delta = 1 },
]

[outcomes.critical]
narrative = "{hero} has the gate open before the others finish unpacking, then stands looking at it, because whoever barred it did so from the inside and never left. {hero} finds the second way out before mentioning any of that, which is why nobody panics. What is behind the gate is worth more than the whole of the week that got them to it."
consequences = [
  { kind = "score", delta = 2 },
  { kind = "coin", delta = 15 },
]
