# Spheres — the worlds a Patron's work comes from.
#
# CONTROLLED TAG SET. These eleven tags are the whole vocabulary. Every `tags` entry in
# this file, every `tags` and `conditions.tags` entry in content/vignettes/*.toml, and
# every `tags` entry on a Trait modifier in content/traits.toml is drawn from it and
# nothing else:
#
#   escort   moving someone or something that cannot move itself safely
#   wilds    open country, away from any walls
#   town     streets, tables, offices, people who write things down
#   talk     the work turns on what is said
#   fight    the work turns on force
#   delve    underground, in workings or crypts
#   dark     without light, or at night
#   water    river, ford, weir, flood
#   guard    standing over something so that nothing happens to it
#   recover  fetching back what is lost, or bringing someone in
#   hunt     finding a thing that does not want to be found
#
# `difficulty` is the Commission's base DC, 8-15, and shifts every Beat's DC by
# (difficulty - 11). Sphere names are lowercase noun phrases because they are dropped
# into narrative prose through the {sphere} token.

[[spheres]]
id = "river-towns"
name = "the river towns"
patronNames = [
  "The Wending Ferrymen",
  "Reeve Halloran of Lowford",
  "The Salt Factors of Marrow Quay",
  "Widow Sessil, who keeps the weir",
  "The Bargemen of Wend Water",
  "Alderman Prees of Byre",
  "The Tithe Office at Lowford",
]
commissionTitles = [
  { title = "The tithe barge down to Lowford", difficulty = 9, tags = ["escort", "water"] },
  { title = "The night watch at Marrow Quay", difficulty = 8, tags = ["guard", "town"] },
  { title = "The ferryman's strongbox in the shallows", difficulty = 11, tags = ["recover", "water"] },
  { title = "The salt factor's walk along the towpath", difficulty = 10, tags = ["escort", "talk"] },
  { title = "Whatever has fouled the Lowford weir", difficulty = 13, tags = ["water", "wilds"] },
  { title = "The quarrel over the Lowford crossing", difficulty = 12, tags = ["talk", "town"] },
  { title = "The thing taking dogs off the bank", difficulty = 14, tags = ["hunt", "wilds", "water"] },
]

