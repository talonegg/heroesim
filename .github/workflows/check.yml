name: check

# Lint, typecheck and test on push and pull request, on the Node of `.node-version`. No deploy, and
# no repository secret is referenced anywhere below. The floor `engines` declares is that Node, the
# one this repository is developed on, and nothing is released on an older one (DL-235, ADR-0007),
# so one job tests the floor rather than assuming it.
#
# DL-299: a pull request's `check` is kept for Dependabot's pull requests, whose branches the push
# trigger does not name; a run on a dev branch or a pull request supersedes an earlier one still
# going, and a timeout caps a hung run. A release branch's runs are never cancelled, since the
# deploy reads their result (DL-235).
#
# DL-124: every line's branches by pattern, `v#.#-dev` and `v#.#-release`, so that a new line edits
# no workflow; and the browser specs, `npm run e2e -w web`, in Chromium at the three widths,
# superseding INPUTS 7.10's "no Playwright in CI". `main` is not here: only a release branch's
# merged pull request moves it, whose commit `check` has already passed on the release branch. The
# deploy runs the suite and the specs again unless the release's tree is the one they passed on
# (DL-235).
#
# DL-327: the `plan` job (web/scripts/plan.mjs) decides what a run does, and `check` and `e2e` wait for
# it. A push to a release branch of a commit that `check` passed on already, on a dev branch, runs
# neither, the dev branch's run being the one the deploy reads; and the browser specs run unless no
# path the page or its specs read changed since the push's `before` or the pull request's base and a
# push run of `check` passed on that base, so that no green run stands on specs that never passed. A
# job skipped by its own condition reports success to a required check, and only a literal `true` or
# `false` skips, so a plan that failed to decide runs everything. A pull request's `check` is never
# skipped as a duplicate.
on:
  push:
    branches:
      - 'v*-dev'
      - 'v*-release'
  pull_request:
    branches:
      - 'v*-dev'
      - 'v*-release'

permissions:
  contents: read

# DL-299: one run per branch or pull request at a time; a newer push cancels the older run, except on
# a release branch, whose every run is read by the deploy.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ !endsWith(github.ref_name, '-release') }}

jobs:
  plan:
    # Pinned, not ubuntu-latest, so no runner image change lands mid-release (DL-313).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read, for plan.mjs to read check's runs, as tested.mjs does (DL-235).
    permissions:
      contents: read
      actions: read
    outputs:
      duplicate: ${{ steps.plan.outputs.duplicate }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Whether this commit passed already, and whether the page or its specs changed
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node web/scripts/plan.mjs "$EVENT" "$BASE"

  check:
    needs: plan
    if: needs.plan.outputs.duplicate != 'true'
    # Pinned, not ubuntu-latest, so no runner image change lands mid-release (DL-313).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The portrait tool's tests (tools/portraits, v1.1.3-S2) draw pictures in Chromium.
      - name: Playwright's version, for the browsers' cache
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm test

  e2e:
    needs: plan
    if: needs.plan.outputs.duplicate != 'true' && needs.plan.outputs.browser != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Playwright's version, for the browsers' cache
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - name: The browser specs
        run: npm run e2e -w web
      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
