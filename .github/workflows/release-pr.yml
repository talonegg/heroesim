name: release-pr

# DL-124: a push to a release branch `v#.#-release` that leaves it ahead of `main` opens its pull
# request to `main`, or updates the open one, naming the tag its merge will release
# (web/scripts/release.mjs). Merging it is the release (release.yml); leaving it open holds the
# next release while commits gather. A branch whose merge would release nothing, an older line's,
# gets no pull request. The pull request's head carries this push's `check`. Needs the repository
# setting "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches:
      - 'v*-release'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-pr-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: The pull request to main
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "There is no main yet: no pull request."
            exit 0
          fi
          ahead="$(git rev-list --count origin/main..HEAD)"
          if [ "$ahead" -eq 0 ]; then
            echo "$BRANCH holds nothing main does not: no pull request."
            exit 0
          fi
          if ! tag="$(node web/scripts/release.mjs next "$BRANCH")"; then
            echo "Merging $BRANCH would release nothing (above): no pull request."
            exit 0
          fi
          title="Release $tag from $BRANCH"
          body="$(cat <<EOF
          Merging this releases **$tag**: \`release.yml\` tags the merge and deploys it to the Worker and to Pages, after the checks, the browser specs and a read of the Pages production branch, then runs the live check on both addresses and publishes the record as the tag's GitHub Release (DL-124).

          $ahead commit(s) from \`$BRANCH\`. Merge with a merge commit. To hold the release, leave this open: later pushes to \`$BRANCH\` update it.

          Raised by \`release-pr.yml\`.
          EOF
          )"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "Updated #$number: $title."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
